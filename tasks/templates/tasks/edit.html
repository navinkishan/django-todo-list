
<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 40px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-link {
            margin-top: 20px;
        }

        .back-link a {
            color: #2563eb;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Edit Task</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="title">Task Title:</label>

            <input
                type="text"
                name="title"
                id="title"
                value="{{ task.title }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="description">Task Description:</label>

            <textarea
                name="description"
                id="description"
            >{{ task.description }}</textarea>
        </div>

        <div class="form-group">
            <label for="priority">Task Priority:</label>

            <select name="priority" id="priority" required>
                <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>

                <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>

                <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
            </select>
        </div>

        <div class="form-group">
            <label for="due_date">Task Due Date:</label>

            <input
                type="date"
                name="due_date"
                id="due_date"
                value="{{ task.due_date|date:'Y-m-d' }}"
            >
        </div>

        <button type="submit">Update Task</button>

    </form>

    <p class="back-link">
        <a href="{% url 'home' %}">Back to Home</a>
    </p>

</div>

</body>
</html>
